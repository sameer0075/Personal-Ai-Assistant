services:
  db:
    image: pgvector/pgvector:pg16
    container_name: ai-assistant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: assistant
      POSTGRES_PASSWORD: assistant_dev_password
      POSTGRES_DB: ai_assistant
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistant -d ai_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pg_data:
